<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TET-II Study Schedule Dashboard</title>
    <style>
        :root {
            --bg-image: url('dashboard-bg.jpg');
            --text-color: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.25);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --text-color: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(0, 0, 0, 0.15);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--card-shadow);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }

        .title-area h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #38bdf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .top-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 60vh;
            overflow-y: auto;
            border-radius: 12px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
            min-width: 850px;
        }

        .schedule-table th, .schedule-table td {
            padding: 10px 12px;
            text-align: center;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .schedule-table th {
            background: rgba(99, 102, 241, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .day-cell {
            background: rgba(236, 72, 153, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 700;
            width: 110px;
            backdrop-filter: blur(8px);
        }

        /* Fully Transparent & Distinctly Colored Subject Cells */
        .subject-cell {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            font-weight: 600;
            color: #ffffff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .subject-cell:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.22);
            border-color: #38bdf8;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 0.82rem;
            opacity: 0.9;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-wrapper">
        <div class="header-bar">
            <div class="title-area">
                <h1>TET-II Study Schedule Dashboard</h1>
            </div>
            <div class="top-controls">
                <button class="btn" onclick="toggleTheme()">Light / Dark Mode</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>Morning 1</th>
                        <th>Morning 2</th>
                        <th>Evening 1</th>
                        <th>Evening 2</th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>
        <div class="footer-note">
            Click any subject to start quiz with Next, Skip, Review Palette, Score, and Explanations!
        </div>
    </div>

    <script src="question-bank.js"></script>
    <script>
        // Array of distinct vibrant RGBA colors for each cell so every tab has a unique color
        const distinctColors = [
            'rgba(244, 63, 94, 0.28)', 'rgba(168, 85, 247, 0.28)', 'rgba(56, 189, 248, 0.28)', 'rgba(34, 197, 94, 0.28)',
            'rgba(234, 179, 8, 0.28)', 'rgba(236, 72, 153, 0.28)', 'rgba(99, 102, 241, 0.28)', 'rgba(20, 184, 166, 0.28)',
            'rgba(249, 115, 22, 0.28)', 'rgba(139, 92, 246, 0.28)', 'rgba(14, 165, 233, 0.28)', 'rgba(16, 185, 129, 0.28)',
            'rgba(217, 70, 239, 0.28)', 'rgba(251, 191, 36, 0.28)', 'rgba(244, 63, 94, 0.28)', 'rgba(59, 130, 246, 0.28)',
            'rgba(16, 185, 129, 0.28)', 'rgba(168, 85, 247, 0.28)', 'rgba(239, 68, 68, 0.28)', 'rgba(14, 165, 233, 0.28)',
            'rgba(245, 158, 11, 0.28)', 'rgba(99, 102, 241, 0.28)', 'rgba(236, 72, 153, 0.28)', 'rgba(34, 197, 94, 0.28)',
            'rgba(147, 51, 234, 0.28)', 'rgba(6, 182, 212, 0.28)', 'rgba(249, 115, 22, 0.28)', 'rgba(16, 185, 129, 0.28)'
        ];

        function renderSchedule() {
            const tbody = document.getElementById("schedule-body");
            tbody.innerHTML = "";
            if (typeof weeklySchedule === 'undefined') return;

            let colorIdx = 0;
            weeklySchedule.forEach(row => {
                let tr = document.createElement("tr");
                let tdDay = document.createElement("td");
                tdDay.className = "day-cell";
                tdDay.innerText = row.day;
                tr.appendChild(tdDay);

                ['morning1', 'morning2', 'evening1', 'evening2'].forEach(slot => {
                    let td = document.createElement("td");
                    let subName = row[slot];
                    td.className = "subject-cell";
                    td.innerText = subName;
                    
                    // Assign a unique distinct transparent background color to each cell tab
                    td.style.backgroundColor = distinctColors[colorIdx % distinctColors.length];
                    colorIdx++;

                    td.onclick = () => {
                        localStorage.setItem("selectedSubject", subName);
                        window.location.href = "quiz.html";
                    };
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute("data-theme") === "dark") {
                body.setAttribute("data-theme", "light");
            } else {
                body.setAttribute("data-theme", "dark");
            }
        }

        renderSchedule();
    </script>
</body>
</html>
