<style>

s:12px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px)}th{font-family:'Great Vibes',cursive;font-size:21px;background:rgba(87,75,180,.55)}.day{font-size:19px;background:linear-gradient(135deg,rgba(207,54,151,.55),rgba(111,62,183,.55));white-space:nowrap}.subjectCell{min-width:170px;font-size:19px;font-weight:600;color:#fff;transition:.18s}.subjectCell:hover{transform:translateY(-2px);filter:brightness(1.15);border-color:#d0a5ff}.s0{background:rgba(133,65,149,.45)}.s1{background:rgba(55,78,165,.45)}.s2{background:rgba(0,126,151,.38)}.s3{background:rgba(106,52,131,.48)}.note{text-align:center;font-size:18px;color:var(--muted);margin:16px 0 2px}.hidden{display:none!important}.quizCard{padding:20px}.quizTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.quizTitle{font-size:31px}.pill{padding:7px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px;color:var(--muted)}.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:linear-gradient(90deg,#55d6ff,#a970ff,#ff65b4);width:0;transition:.2s}.qmeta{color:var(--muted);font-size:12px;margin-bottom:8px}.question{font-size:clamp(19px,2.6vw,27px);line-height:1.5;font-weight:800;white-space:pre-wrap;margin-bottom:18px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:15px;padding:14px;transition:.15s}.option:hover:not(:disabled){transform:translateY(-1px);border-color:#b996ff}.letter{min-width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:900}.option.correct{background:rgba(24,211,139,.16);border-color:rgba(24,211,139,.8)}.option.wrong{background:rgba(255,85,112,.16);border-color:rgba(255,85,112,.85)}.option.dim{opacity:.52}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.feedback.ok{border-color:rgba(24,211,139,.55)}.feedback.bad{border-color:rgba(255,85,112,.55)}.feedbackTitle{font-weight:900;margin-bottom:5px}.quizBtns{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:17px}.quizBtns .btn{min-width:110px}.warning{font-size:12px;color:#ffd88a;margin-top:9px}.summary{text-align:center;padding:26px}.bigScore{font-size:58px;font-weight:900}.miniReview{display:grid;gap:8px;text-align:left;margin-top:18px}.reviewItem{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04)}.modal{position:fixed;inset:0;background:rgba(4,5,20,.58);display:grid;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(8px)}.modalCard{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.modalTitle{font-size:30px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input[type=text],input[type=file]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.16);color:var(--text)}.editorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.greet{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(7,6,28,.52);backdrop-filter:blur(5px);pointer-events:none;animation:fade 2.8s forwards}.greetBox{font-size:clamp(42px,9vw,92px);background:linear-gradient(90deg,#5ee7ff,#c28bff,#ff77bd);-webkit-background-clip:text;color:transparent;text-shadow:0 0 35px rgba(180,130,255,.45);animation:pop 1.2s ease both}@keyframes pop{0%{transform:scale(.65);opacity:0}45%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes fade{0%,72%{opacity:1}100%{opacity:0}}.toast{position:fixed;right:18px;bottom:18px;z-index:60;background:rgba(18,20,57,.95);border:1px solid var .subjectCell:before{content:"";position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.26) 48%,transparent 58%);transform:translateX(-35%) rotate(8deg);transition:.55s;z-index:-1}
.subjectCell:hover:before{transform:translateX(35%) rotate(8deg)}
.subjectCell:hover{transform:translateY(-3px) scale(1.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px var(--tabShadow),0 0 24px var(--tabGlow);border-color:rgba(255,255,255,.65)}

<script>
// Dashboard, Schedule & Quiz Engine Script
const defaultSchedule = [
  { day: "Day 1", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 2", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 3", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 4", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 5", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 6", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" },
  { day: "Day 7", m1: "Current Affairs", m2: "Mix Grammar", e1: "Part of Speech", e2: "E. Grammar Part 1" }
];

let questionBank = {};
let currentSubject = '';
let currentQuestions = [];
let currentIndex = 0;
let userAnswers = {};
let showHintFlag = false;

function loadBank() {
  try {
    const raw = document.getElementById('bankData').textContent;
    questionBank = JSON.parse(raw);
  } catch(e) {
    questionBank = {};
  }
}

function renderSchedule() {
  const tbody = document.getElementById('scheduleBody');
  if(!tbody) return;
  tbody.innerHTML = '';
  defaultSchedule.forEach((row) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="day">${row.day}</td>
      <td class="subjectCell s0" onclick="startQuiz('${row.m1}')">${row.m1}</td>
      <td class="subjectCell s1" onclick="startQuiz('${row.m2}')">${row.m2}</td>
      <td class="subjectCell s2" onclick="startQuiz('${row.e1}')">${row.e1}</td>
      <td class="subjectCell s3" onclick="startQuiz('${row.e2}')">${row.e2}</td>
    `;
    tbody.appendChild(tr);
  });
}

function startQuiz(subject) {
  loadBank();
  currentSubject = subject;
  currentQuestions = questionBank[subject] || [];
  currentIndex = 0;
  userAnswers = {};
  showHintFlag = false;

  if(currentQuestions.length === 0) {
    alert("આ વિષય માટે કોઈ પ્રશ્નો ઉપલબ્ધ નથી.");
    return;
  }

  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('summarySection').classList.add('hidden');
  document.getElementById('quizSection').classList.remove('hidden');
  document.body.classList.add('quiz-mode');
  
  document.getElementById('quizTitle').innerText = subject;
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('qMeta').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length} • ${q.topic || currentSubject}`;
  document.getElementById('scorePill').innerText = `${Object.keys(userAnswers).length} / ${currentQuestions.length} answered`;
  document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
  document.getElementById('question').innerText = q.question;

  const hintEl = document.getElementById('preHint');
  if(showHintFlag && q.hint) {
    hintEl.innerText = "💡 Hint: " + q.hint;
    hintEl.classList.remove('hidden');
  } else {
    hintEl.classList.add('hidden');
  }

  const optContainer = document.getElementById('options');
  optContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    const isAnswered = userAnswers[currentIndex] !== undefined;
    const selectedOpt = userAnswers[currentIndex];

    if(isAnswered) {
      btn.disabled = true;
      if(idx === q.answer) btn.classList.add('correct');
      else if(idx === selectedOpt) btn.classList.add('wrong');
      else btn.classList.add('dim');
    }

    btn.innerHTML = `<div class="letter">${letters[idx]}</div><div>${opt}</div>`;
    btn.onclick = () => selectOption(idx);
    optContainer.appendChild(btn);
  });

  const feedbackEl = document.getElementById('feedback');
  if(userAnswers[currentIndex] !== undefined) {
    feedbackEl.classList.remove('hidden');
    const isCorrect = userAnswers[currentIndex] === q.answer;
    feedbackEl.className = `feedback ${isCorrect ? 'ok' : 'bad'}`;
    feedbackEl.innerHTML = `<div class="feedbackTitle">${isCorrect ? '✓ Correct' : '✕ Incorrect'}</div><div>${q.explanation || ''}</div>`;
  } else {
    feedbackEl.classList.add('hidden');
  }

  document.getElementById('backBtn').disabled = currentIndex === 0;
  document.getElementById('finishBtn.disabled') = Object.keys(userAnswers).length === 0;
}

function selectOption(idx) {
  if(userAnswers[currentIndex] !== undefined) return;
  userAnswers[currentIndex] = idx;
  renderQuestion();
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    showHintFlag = false;
    renderQuestion();
  } else {
    showSummary();
  }
});

document.getElementById('backBtn').addEventListener('click', () => {
  if(currentIndex > 0) {
    currentIndex--;
    showHintFlag = false;
    renderQuestion();
  }
});

document.getElementById('skipBtn').addEventListener('click', () => {
  if(currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    showHintFlag = false;
    renderQuestion();
  }
});

document.getElementById('hintBtn').addEventListener('click', () => {
  showHintFlag = !showHintFlag;
  document.getElementById('hintBtn').innerText = showHintFlag ? "💡 Hint: On" : "💡 Hint: Off";
  renderQuestion();
});

document.getElementById('scheduleBackBtn').addEventListener('click', () => {
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('summarySection').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.body.classList.remove('quiz-mode');
});

function showSummary() {
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('summarySection').classList.remove('hidden');
  
  let correctCount = 0;
  currentQuestions.forEach((q, idx) => {
    if(userAnswers[idx] === q.answer) correctCount++;
  });
  const pct = Math.round((correctCount / currentQuestions.length) * 100);
  document.getElementById('bigScore').innerText = pct + '%';
  document.getElementById('summaryText').innerText = `You answered ${correctCount} out of ${currentQuestions.length} questions correctly.`;
}

document.getElementById('homeBtn').addEventListener('click', () => {
  document.getElementById('summarySection').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.body.classList.remove('quiz-mode');
});

document.getElementById('againBtn').addEventListener('click', () => {
  startQuiz(currentSubject);
});

window.addEventListener('DOMContentLoaded', () => {
  loadBank();
  renderSchedule();
});
</script>
</body>
</html>
