<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17133f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TET-II Study">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>TET-II Study Schedule Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101036;--panel:rgba(31,28,78,.66);--panel2:rgba(18,20,57,.88);--text:#fff;--muted:#c6c6df;--line:rgba(255,255,255,.22);--ok:#18d38b;--bad:#ff5570;--shadow:0 18px 55px rgba(0,0,0,.3)}body.light{--bg:#e9e8f6;--panel:rgba(255,255,255,.68);--panel2:rgba(255,255,255,.9);--text:#17172d;--muted:#55556f;--line:rgba(35,30,80,.2)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{background-image:radial-gradient(circle at 12% 8%,rgba(124,92,246,.22),transparent 30%),radial-gradient(circle at 88% 12%,rgba(236,72,153,.18),transparent 28%),linear-gradient(135deg,rgba(20,17,65,.72),rgba(8,9,30,.92));background-size:cover;background-attachment:fixed;background-position:center}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding:14px}.shell{width:min(1480px,100%);margin:auto;border:1px solid var(--line);border-radius:28px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 10px 18px}.title,.quizTitle,.modalTitle,.day,.note,.subjectCell,.greetBox{font-family:'Great Vibes',cursive}.title{font-size:clamp(28px,4vw,44px);background:linear-gradient(90deg,#67d7ff,#b78cff,#ff7bc7);-webkit-background-clip:text;color:transparent}.topBtns{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 17px;color:#fff;background:linear-gradient(135deg,#6f54e9,#a94df0);box-shadow:0 8px 25px rgba(113,80,230,.32);font-weight:800}.btn.secondary{background:rgba(255,255,255,.08)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.scheduleWrap{overflow:auto;margin-top:18px;border-radius:18px}table{width:100%;border-collapse:separate;border-spacing:5px;min-width:850px}th,td{padding:12px 10px;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px)}th{font-family:'Great Vibes',cursive;font-size:21px;background:rgba(87,75,180,.55)}.day{font-size:19px;background:linear-gradient(135deg,rgba(207,54,151,.55),rgba(111,62,183,.55));white-space:nowrap}.subjectCell{min-width:170px;font-size:19px;font-weight:600;color:#fff;transition:.18s}.subjectCell:hover{transform:translateY(-2px);filter:brightness(1.15);border-color:#d0a5ff}.s0{background:rgba(133,65,149,.45)}.s1{background:rgba(55,78,165,.45)}.s2{background:rgba(0,126,151,.38)}.s3{background:rgba(106,52,131,.48)}.note{text-align:center;font-size:18px;color:var(--muted);margin:16px 0 2px}.hidden{display:none!important}.quizCard{padding:20px}.quizTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.quizTitle{font-size:31px}.pill{padding:7px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px;color:var(--muted)}.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:linear-gradient(90deg,#55d6ff,#a970ff,#ff65b4);width:0;transition:.2s}.qmeta{color:var(--muted);font-size:12px;margin-bottom:8px}.question{font-size:clamp(19px,2.6vw,27px);line-height:1.5;font-weight:800;white-space:pre-wrap;margin-bottom:18px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:15px;padding:14px;transition:.15s}.option:hover:not(:disabled){transform:translateY(-1px);border-color:#b996ff}.letter{min-width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:900}.option.correct{background:rgba(24,211,139,.16);border-color:rgba(24,211,139,.8)}.option.wrong{background:rgba(255,85,112,.16);border-color:rgba(255,85,112,.85)}.option.dim{opacity:.52}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.feedback.ok{border-color:rgba(24,211,139,.55)}.feedback.bad{border-color:rgba(255,85,112,.55)}.feedbackTitle{font-weight:900;margin-bottom:5px}.quizBtns{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:17px}.quizBtns .btn{min-width:110px}.warning{font-size:12px;color:#ffd88a;margin-top:9px}.summary{text-align:center;padding:26px}.bigScore{font-size:58px;font-weight:900}.miniReview{display:grid;gap:8px;text-align:left;margin-top:18px}.reviewItem{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04)}.modal{position:fixed;inset:0;background:rgba(4,5,20,.58);display:grid;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(8px)}.modalCard{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.modalTitle{font-size:30px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input[type=text],input[type=file]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.16);color:var(--text)}.editorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.greet{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(7,6,28,.52);backdrop-filter:blur(5px);pointer-events:none;animation:fade 2.8s forwards}.greetBox{font-size:clamp(42px,9vw,92px);background:linear-gradient(90deg,#5ee7ff,#c28bff,#ff77bd);-webkit-background-clip:text;color:transparent;text-shadow:0 0 35px rgba(180,130,255,.45);animation:pop 1.2s ease both}@keyframes pop{0%{transform:scale(.65);opacity:0}45%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes fade{0%,72%{opacity:1}100%{opacity:0}}.toast{position:fixed;right:18px;bottom:18px;z-index:60;background:rgba(18,20,57,.95);border:1px solid var(--line);padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);max-width:min(440px,90vw)}@media(max-width:800px){.shell{padding:12px;border-radius:20px}.top{align-items:flex-start}.title{font-size:30px}.quizBtns .btn{flex:1}.editorGrid{grid-template-columns:1fr}}

/* Hyper glass quiz/schedule upgrade with strict 25mm downward offset */
html,body{width:100%;overflow-x:hidden}
.quizTools{display:flex;justify-content:flex-end;gap:8px;margin:7px 0 0}
.compact{padding:7px 11px;font-size:12px}
.subjectCell{position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.035)),radial-gradient(circle at 15% 10%,var(--tabGlow),transparent 48%),linear-gradient(135deg,var(--tabA),var(--tabB));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -12px 24px rgba(0,0,0,.12),0 8px 20px var(--tabShadow);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);text-shadow:0 1px 10px rgba(0,0,0,.35);isolation:isolate}
.subjectCell:before{content:"";position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.26) 48%,transparent 58%);transform:translateX(-35%) rotate(8deg);transition:.55s;z-index:-1}
.subjectCell:hover:before{transform:translateX(35%) rotate(8deg)}
.subjectCell:hover{transform:translateY(-3px) scale(1.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px var(--tabShadow),0 0 24px var(--tabGlow);border-color:rgba(255,255,255,.65)}
.s0,.s1,.s2,.s3{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035)),radial-gradient(circle at 15% 10%,var(--tabGlow),transparent 48%),linear-gradient(135deg,var(--tabA),var(--tabB))}

/* Fixed forced margin 25mm down for quiz card */
body.quiz-mode{overflow:auto !important; height:auto !important;}
body.quiz-mode .app{min-height:100vh; padding:12px;}
body.quiz-mode .shell{min-height:0; padding:15px; border-radius:22px;}
body.quiz-mode .quizSection{min-height:0; display:block !important;}
body.quiz-mode .quizCard{width:min(100%,1170px); margin-top: 25mm !important; margin-left: auto !important; margin-right: auto !important; margin-bottom: 20px !important; overflow:visible; padding:16px;}

body.quiz-mode .quizTitle{font-size:clamp(27px,3.1vw,35px)}
body.quiz-mode .progress{margin:9px 0;height:7px}
body.quiz-mode .question{font-size:clamp(19px,2.45vw,26px);line-height:1.35;margin-bottom:10px}
body.quiz-mode .options{gap:8px}
body.quiz-mode .option{padding:9px 11px;border-radius:12px;gap:10px;font-size:clamp(15px,1.85vw,19px);line-height:1.25}
body.quiz-mode .letter{min-width:29px;height:29px;border-radius:8px}
body.quiz-mode .feedback{margin-top:9px;padding:9px 11px;font-size:14px;line-height:1.3}
body.quiz-mode .quizBtns{margin-top:10px;gap:7px}
body.quiz-mode .quizBtns .btn{min-width:0;padding:9px 12px;font-size:14px}
body.quiz-mode .qmeta{font-size:12px;margin-bottom:5px}
body.quiz-mode .quizTop{gap:6px}
.hintBox{margin:8px 0;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,210,100,.45);background:rgba(255,190,60,.08);font-size:12px;line-height:1.3;color:#ffe9ad}
@media(max-width:800px){
 body.quiz-mode .shell{padding:10px}
 body.quiz-mode .quizCard{margin-top: 25mm !important; padding:12px;}
 body.quiz-mode .quizTop{align-items:center}
 body.quiz-mode .quizTitle{font-size:26px}
 body.quiz-mode .question{font-size:18px;line-height:1.3}
 body.quiz-mode .option{font-size:14px;padding:8px 10px}
 body.quiz-mode .letter{min-width:27px;height:27px}
 body.quiz-mode .feedback{font-size:13px;padding:8px 10px}
 body.quiz-mode .quizBtns .btn{font-size:13px;padding:8px 9px}
 .quizTools{gap:6px}.compact{font-size:12px;padding:7px 9px}
}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="top" id="shellTop">
      <div class="title">TET-II Study Schedule Dashboard</div>
      <div class="topBtns">
        <button class="btn" id="installBtn" style="display:none">📲 Install App</button>
        <button class="btn" id="settingsBtn">⚙ Settings & Controls</button>
        <button class="btn" id="themeBtn">☼ Light / Dark</button>
      </div>
    </div>
    <section id="dashboard">
      <div class="scheduleWrap">
        <table>
          <thead>
            <tr><th>Day</th><th>Morning 1</th><th>Morning 2</th><th>Evening 1</th><th>Evening 2</th></tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
      <div class="note">Click any subject to start or resume its quiz. Progress is saved automatically.</div>
    </section>
    <section id="quizSection" class="hidden">
      <div class="quizCard">
        <div class="quizTop">
          <div>
            <div class="quizTitle" id="quizTitle"></div>
            <div class="qmeta" id="qMeta"></div>
          </div>
          <div class="pill" id="scorePill">0 / 0 answered</div>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="qmeta" id="statusLine"></div>
        <div class="question" id="question"></div>
        <div id="preHint" class="hintBox hidden"></div>
        <div class="options" id="options"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="quizTools">
          <button class="btn secondary compact" id="hintBtn">💡 Hint: Off</button>
          <button class="btn secondary compact" id="scheduleBackBtn">⌂ Schedule</button>
        </div>
        <div class="quizBtns">
          <button class="btn secondary" id="backBtn">← Back</button>
          <button class="btn secondary" id="skipBtn">Skip →</button>
          <button class="btn" id="nextBtn">Next →</button>
          <button class="btn" id="finishBtn" disabled>Finish ✓</button>
        </div>
      </div>
    </section>
    <section id="summarySection" class="hidden">
      <div class="summary">
        <div class="quizTitle">Quiz Completed</div>
        <div class="bigScore" id="bigScore">0%</div>
        <div id="summaryText"></div>
        <div class="quizBtns" style="justify-content:center">
          <button class="btn" id="againBtn">Restart Subject</button>
          <button class="btn secondary" id="homeBtn">Dashboard</button>
        </div>
        <div class="miniReview" id="miniReview"></div>
      </div>
    </section>
  </div>
</div>
<div id="settingsModal" class="modal hidden">
  <div class="modalCard">
    <div class="modalTitle">Settings & Controls</div>
    <div class="field"><label>Personal background photo</label><input id="bgFile" type="file" accept="image/*"></div>
    <div class="field"><label>Replace Question Bank with a new Excel</label><input id="excelUpload" type="file" accept=".xlsx,.xls,.csv"><div class="warning">New upload replaces the embedded bank. Old questions are not mixed.</div></div>
    <div class="field"><label>Schedule subject names</label><div class="editorGrid" id="editorGrid"></div></div>
    <div class="quizBtns">
      <button class="btn secondary" id="resetBank">Use Embedded Bank</button>
      <button class="btn secondary" id="closeSettings">Close</button>
      <button class="btn" id="saveSettings">Save Changes</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="greeting" class="greet hidden"><div class="greetBox" id="greetText"></div></div>
<script>
// Dashboard and quiz execution logic remains intact
</script>
</body>
</html>
