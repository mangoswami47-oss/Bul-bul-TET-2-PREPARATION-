<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <style>
        :root {
            --bg-image: url('quiz-bg.jpg');
            --text-color: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.78);
            --glass-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --text-color: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.15);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-wrapper {
            width: 100%;
            max-width: 780px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 25px;
            box-shadow: var(--card-shadow);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }

        .quiz-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .score-board {
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.3);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .palette-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 10px;
            max-height: 90px;
            overflow-y: auto;
        }

        .palette-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palette-btn.current {
            border-color: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        .palette-btn.answered {
            background: rgba(34, 197, 94, 0.35);
            border-color: #22c55e;
        }

        .palette-btn.skipped {
            background: rgba(234, 179, 8, 0.35);
            border-color: #eab308;
        }

        .question-box {
            font-size: 1.08rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.4) !important;
            border-color: #22c55e !important;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.4) !important;
            border-color: #ef4444 !important;
        }

        .explanation-box {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid #38bdf8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
            display: none;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-skip {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body data-theme="dark">

    <div class="quiz-wrapper">
        <div class="quiz-header">
            <div class="quiz-title" id="subject-heading">Subject Name</div>
            <div class="score-board" id="score-display">Score: 0</div>
        </div>

        <div id="quiz-content-area">
            <div class="palette-container" id="palette-box"></div>

            <div id="q-counter" style="font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.85;">Question 1 / 1</div>
            <div class="question-box" id="question-text">Loading question...</div>
            
            <div class="options-list" id="options-container"></div>

            <div class="explanation-box" id="explanation-container">
                <strong>Explanation:</strong> <span id="explanation-text"></span>
            </div>

            <div class="quiz-footer">
                <button class="btn" onclick="goBackToSchedule()">Back to Schedule</button>
                <div class="btn-group">
                    <button class="btn btn-skip" id="skip-btn" onclick="skipQuestion()">Skip ⏭️</button>
                    <button class="btn" id="next-btn" onclick="nextQuestion()">Next ➡️</button>
                </div>
            </div>
        </div>

        <div id="result-area" style="display:none; text-align: center; padding: 20px;">
            <h2 style="margin-bottom: 15px; color: #38bdf8;">🎉 Quiz Completed!</h2>
            <p id="final-score-text" style="font-size: 1.2rem; font-weight: 600; margin-bottom: 25px;"></p>
            <button class="btn" onclick="goBackToSchedule()">Return to Schedule 🏠</button>
        </div>
    </div>

    <script src="question-bank.js"></script>
    <script>
        const selectedSubName = localStorage.getItem("selectedSubject") || "Mix Quiz";
        document.getElementById("subject-heading").innerText = selectedSubName;

        let subjectKey = "";
        for (let k in quizData) {
            if (quizData[k].name.toLowerCase() === selectedSubName.toLowerCase()) {
                subjectKey = k;
                break;
            }
        }

        if (!subjectKey || !quizData[subjectKey]) {
            for (let k in quizData) {
                if (selectedSubName.toLowerCase().includes(k) || k.includes(selectedSubName.toLowerCase())) {
                    subjectKey = k;
                    break;
                }
            }
        }

        if (!subjectKey || !quizData[subjectKey]) {
            subjectKey = Object.keys(quizData)[0];
        }

        const currentQuiz = quizData[subjectKey];
        const totalQ = currentQuiz.questions.length;
        
        let currentIndex = 0;
        let score = 0;
        let userAnswers = new Array(totalQ).fill(null);
        let questionStatus = new Array(totalQ).fill('unattempted');

        function updateScoreDisplay() {
            let correctCount = 0;
            for(let i=0; i<totalQ; i++) {
                if(userAnswers[i] !== null && userAnswers[i] === currentQuiz.questions[i].answer) {
                    correctCount++;
                }
            }
            score = correctCount;
            document.getElementById("score-display").innerText = `Score: ${score} / ${totalQ}`;
        }

        function renderPalette() {
            const paletteBox = document.getElementById("palette-box");
            paletteBox.innerHTML = "";
            for(let i=0; i<totalQ; i++) {
                let btn = document.createElement("button");
                btn.className = "palette-btn";
                btn.innerText = i + 1;
                
                if (i === currentIndex) {
                    btn.classList.add("current");
                }
                if (questionStatus[i] === 'answered') {
                    btn.classList.add("answered");
                } else if (questionStatus[i] === 'skipped') {
                    btn.classList.add("skipped");
                }

                btn.onclick = () => {
                    currentIndex = i;
                    loadQuizQuestion();
                };
                paletteBox.appendChild(btn);
            }
        }

        function loadQuizQuestion() {
            const qObj = currentQuiz.questions[currentIndex];
            document.getElementById("q-counter").innerText = `Question ${currentIndex + 1} / ${totalQ}`;
            document.getElementById("question-text").innerText = qObj.q;
            document.getElementById("explanation-container").style.display = "none";

            updateScoreDisplay();
            renderPalette();

            const optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";

            const selectedOpt = userAnswers[currentIndex];
            const isAlreadyAnswered = (selectedOpt !== null && selectedOpt !== 'skipped');

            qObj.options.forEach((opt, idx) => {
                let optBtn = document.createElement("button");
                optBtn.className = "option-btn";
                optBtn.innerText = opt;
                
                if (isAlreadyAnswered) {
                    optBtn.disabled = true;
                    if (idx === qObj.answer) {
                        optBtn.classList.add("correct");
                    } else if (idx === selectedOpt) {
                        optBtn.classList.add("wrong");
                    }
                } else {
                    optBtn.onclick = () => selectAnswer(idx, qObj.answer, optBtn);
                }
                optContainer.appendChild(optBtn);
            });

            if (isAlreadyAnswered && qObj.explanation) {
                document.getElementById("explanation-text").innerText = qObj.explanation;
                document.getElementById("explanation-container").style.display = "block";
            }

            const nextBtn = document.getElementById("next-btn");
            if (currentIndex === totalQ - 1) {
                nextBtn.innerText = "Finish Quiz 🏁";
            } else {
                nextBtn.innerText = "Next ➡️";
            }
        }

        function selectAnswer(selectedIdx, correctIdx, btnElement) {
            userAnswers[currentIndex] = selectedIdx;
            questionStatus[currentIndex] = 'answered';

            const allButtons = document.querySelectorAll(".option-btn");
            allButtons.forEach(b => b.disabled = true);

            if (selectedIdx === correctIdx) {
                btnElement.classList.add("correct");
            } else {
                btnElement.classList.add("wrong");
                allButtons[correctIdx].classList.add("correct");
            }

            const qObj = currentQuiz.questions[currentIndex];
            if (qObj.explanation) {
                document.getElementById("explanation-text").innerText = qObj.explanation;
                document.getElementById("explanation-container").style.display = "block";
            }

            updateScoreDisplay();
            renderPalette();
        }

        function skipQuestion() {
            if (userAnswers[currentIndex] === null || userAnswers[currentIndex] === 'skipped') {
                userAnswers[currentIndex] = 'skipped';
                questionStatus[currentIndex] = 'skipped';
            }
            moveToNextUnansweredOrNext();
        }

        function nextQuestion() {
            if (currentIndex < totalQ - 1) {
                currentIndex++;
                loadQuizQuestion();
            } else {
                checkQuizCompletion();
            }
        }

        function moveToNextUnansweredOrNext() {
            if (currentIndex < totalQ - 1) {
                currentIndex++;
                loadQuizQuestion();
            } else {
                let firstSkipped = questionStatus.indexOf('skipped');
                if (firstSkipped !== -1) {
                    currentIndex = firstSkipped;
                    loadQuizQuestion();
                } else {
                    checkQuizCompletion();
                }
            }
        }

        function checkQuizCompletion() {
            let unattemptedOrSkipped = questionStatus.filter(s => s === 'unattempted' || s === 'skipped').length;
            if (unattemptedOrSkipped > 0) {
                let firstRem = questionStatus.findIndex(s => s === 'unattempted' || s === 'skipped');
                if (firstRem !== -1) {
                    currentIndex = firstRem;
                    loadQuizQuestion();
                    return;
                }
            }

            document.getElementById("quiz-content-area").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            document.getElementById("final-score-text").innerText = `Your Final Score: ${score} / ${totalQ}`;
        }

        function goBackToSchedule() {
            window.location.href = "index.html";
        }

        loadQuizQuestion();
    </script>
</body>
</html>
